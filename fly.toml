app = "nyc-dining"
primary_region = "ewr"

[build]

[env]
  DATA_DIR = "/data"
  FRONTEND_DIR = "/app/frontend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 5

[[mounts]]
  source = "dining_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Nightly backup process — runs as a separate scheduled Fly Machine.
# Deploy once after initial `fly deploy`:
#   fly machine run . \
#     --schedule daily \
#     --entrypoint "uv run python -m scripts.backup" \
#     --env DATA_DIR=/data \
#     --mount source=dining_data,destination=/data \
#     --vm-memory 256
# Secrets (B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME) are shared
# with the app via `fly secrets set`.
[processes]
  app = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8080"
