app = "nyc-dining"
primary_region = "ewr"

[build]

[env]
  DATA_DIR = "/data"
  FRONTEND_DIR = "/app/frontend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 5

[[mounts]]
  source = "dining_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
